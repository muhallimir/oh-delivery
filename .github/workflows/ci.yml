name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maestro:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List iPhone simulators
        run: xcrun simctl list devices available

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx expo install --check
          npx expo prebuild --platform ios --clean

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> $GITHUB_ENV

      - name: Build and install (Release)
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          npx expo run:ios --device "iPhone 17 Pro" --configuration Release 2>&1 | tail -50

      - name: Boot simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          xcrun simctl bootstatus "iPhone 17 Pro" -b

      - name: Launch app and wait
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcrun simctl launch booted com.amirsali.ohdelivery
          sleep 25

      - name: Run Maestro flow
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          JAVA_HOME: $(/usr/libexec/java_home -v 17)
        run: |
          export PATH="$JAVA_HOME/bin:$HOME/.maestro/bin:$PATH"
          maestro test .maestro/home-flow.yaml

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: |
            ~/.maestro/tests/
            /tmp/*.png
          if-no-files-found: ignore